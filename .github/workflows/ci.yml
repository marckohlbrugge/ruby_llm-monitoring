name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-3.4.6
          bundler-cache: true
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.REPO_SCOPED_TOKEN }}

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rails:
          - "7.0.0"
          - "7.1.0"
          - "7.2.0"
          - "8.0.0"
          - "8.1.0"
    name: Test (Rails ${{ matrix.rails }})

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-3.4.6
          bundler-cache: false
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.REPO_SCOPED_TOKEN }}

      - name: Install dependencies with specific Rails version
        run: bundle install
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.REPO_SCOPED_TOKEN }}
          RAILS_VERSION: ${{ matrix.rails }}

      - name: Setup database
        env:
          RAILS_ENV: test
          RAILS_VERSION: ${{ matrix.rails }}
        run: bin/rails db:setup

      - name: Run tests
        env:
          RAILS_ENV: test
          RAILS_VERSION: ${{ matrix.rails }}
        run: bin/rails test
